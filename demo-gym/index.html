<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GYM · registro de pesos</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icono.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="cabecera">
      <div class="cabecera-fila">
        <h1 class="titulo-vista" id="titulo-vista">Entrenar</h1>
        <span class="estado-sync" id="estado-sync"></span>
        <select class="selector-gym" id="gym-selector" aria-label="Gimnasio"></select>
      </div>
    </header>

    <main class="vista" id="vista"></main>

    <nav class="nav" aria-label="Secciones">
      <button class="nav-boton" data-vista="entrenar" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10" /></svg>
        Entrenar
      </button>
      <button class="nav-boton" data-vista="progreso">
        <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 8" /></svg>
        Progreso
      </button>
      <button class="nav-boton" data-vista="nutricion">
        <svg viewBox="0 0 24 24"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10M17 3c-1.5 2-2 3.5-2 6s.5 3 2 3 2-.5 2-3-.5-4-2-6zM17 12v9" /></svg>
        Nutrición
      </button>
      <button class="nav-boton" data-vista="gimnasios">
        <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M10 21v-5h4v5" /></svg>
        Gimnasios
      </button>
      <button class="nav-boton" data-vista="ajustes">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" /></svg>
        Ajustes
      </button>
    </nav>

    <script type="module">
      import { arrancar } from './js/app.js';
      arrancar().catch((e) => {
        document.getElementById('vista').innerHTML =
          '<div class="vacio"><p>No pude arrancar la app.<br><small>' + e.message + '</small></p></div>';
        console.error(e);
      });
      // El service worker sirve el armazón desde caché para que la app abra sin
      // cobertura. En DESARROLLO (localhost) eso hace que editar un .js y
      // recargar siga mostrando el código viejo — nos costó un buen rato — así
      // que ahí no se registra. En el móvil y en el APK sí, que es donde importa.
      const enDesarrollo = ['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && !enDesarrollo) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
