<!doctype html>
<html lang="es" data-tema="oscuro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b0d11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GYM · registro de pesos</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icono.svg" type="image/svg+xml" />
    <link rel="preload" href="fuentes/archivo-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="cabecera">
      <div class="cabecera-fila">
        <h1 class="titulo-vista" id="titulo-vista">Entrenar</h1>
        <span class="estado-sync" id="estado-sync"></span>
        <button class="selector-gym" id="gym-selector" aria-label="Cambiar de gimnasio" aria-haspopup="dialog">
          <span></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
        </button>
      </div>
    </header>

    <main class="vista" id="vista"></main>

    <button class="fab oculto" id="fab" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
      <span class="fab-texto"></span>
    </button>

    <nav class="nav" aria-label="Secciones">
      <button class="nav-boton" data-vista="entrenar" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10" /></svg>
        <span class="nav-texto">Entrenar</span>
      </button>
      <button class="nav-boton" data-vista="progreso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15l3.5-4 3 2.5L20 8" /></svg>
        <span class="nav-texto">Progreso</span>
      </button>
      <button class="nav-boton" data-vista="nutricion">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v8a3 3 0 0 0 6 0V3M8 11v10M17 3c-1.5 2-2 3.5-2 6s.5 3 2 3 2-.5 2-3-.5-4-2-6zM17 12v9" /></svg>
        <span class="nav-texto">Nutrición</span>
      </button>
      <button class="nav-boton" data-vista="plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4M16 3v4M3 11h18M8 15h3M8 18h6" /></svg>
        <span class="nav-texto">Plan</span>
      </button>
      <!-- Perfil ocupa el hueco que tenía Ajustes, con el mismo criterio con el
           que Gimnasios salió de la barra en la 0.11.0: aquí van los cinco
           sitios de uso DIARIO. Los ajustes se tocan una vez al año y se llega
           a ellos desde dentro del perfil. -->
      <button class="nav-boton" data-vista="perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" /></svg>
        <span class="nav-texto">Perfil</span>
      </button>
    </nav>

    <script type="module">
      import { arrancar } from './js/app.js';
      arrancar().catch((e) => {
        document.getElementById('vista').innerHTML =
          '<div class="vacio"><p>No pude arrancar la app.<br><small>' + e.message + '</small></p></div>';
        console.error(e);
      });
      // El service worker sirve el armazón desde caché para que la app abra sin
      // cobertura. En DESARROLLO (localhost) eso hace que editar un .js y
      // recargar siga mostrando el código viejo — nos costó un buen rato — así
      // que ahí no se registra. En el móvil y en el APK sí, que es donde importa.
      const enDesarrollo = ['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && !enDesarrollo) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
